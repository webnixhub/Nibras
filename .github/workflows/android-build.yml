name: Android Preview Build

# Manual trigger only for now — one build per push would burn Actions
# minutes fast on a repo this size (153MB project archive per the last
# EAS log). Trigger from the Actions tab: Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # WAS 60 — first real run hit this ceiling after making genuine
    # progress (not stuck), per the annotation "exceeded 1h0m0s".
    # 90 gives headroom for a from-scratch native build (QVAC llamacpp
    # + Bare + RN, no Gradle cache yet). If a build legitimately needs
    # more than this, that's a signal to look at what's slow, not just
    # raise the number again.
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # Caches ~/.gradle/caches and wrapper dists between runs.
          # Won't help this run, but the *next* one skips re-downloading
          # Gradle + dependencies from scratch — meaningful on a build
          # this native-lib-heavy.
          cache: 'gradle'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Log in to EAS (non-interactive)
        # EXPO_TOKEN must be set as a GitHub Actions secret first —
        # see the setup notes. This does NOT consume EAS cloud build
        # quota — it only authenticates so eas can read your project
        # config and credentials. The actual build runs locally on
        # this runner via --local below.
        run: echo "EXPO_TOKEN is set via secrets, no interactive login needed"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview APK locally
        run: eas build --profile preview --platform android --local --non-interactive --output ./build.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Forces Gradle to print full stack traces inline instead of
          # just "FAILED" — the last run showed three FAILED tasks
          # (react-native-purchases:lintVitalAnalyzeRelease,
          # app:mergeReleaseResources, expo-modules-core:lintVitalAnalyzeRelease)
          # but never printed the actual error before hanging 48min and
          # getting force-cancelled by the job timeout. This is the
          # single-variable fix to see WHY before guessing at anything.
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Upload Gradle reports on failure
        # Runs even if the build step above failed — the previous run's
        # actual error detail was lost because the job never reached
        # this point (it hung 48min post-failure until the workflow
        # timeout force-cancelled it). This grabs whatever Gradle wrote
        # to disk regardless of how the build step ends.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Report APK size
        run: |
          ls -lh build.apk
          echo "APK size: $(du -h build.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nibras-preview-apk
          path: build.apk
          retention-days: 14
